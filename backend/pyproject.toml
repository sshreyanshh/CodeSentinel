[project]
name = "codesentinel-backend"
version = "0.1.0"
description = "CodeSentinel: Theory of Computation based source code analyzer"
readme = "README.md"
authors = [
    { name = "Shreyansh Srivastava", email = "shreyansh.backup7@gmail.com" },
    { name = "Kaustubh Mishra", email = "kkaustubhmedia@gmail.com" },
    { name = "Abhigya Narayan Awasthi", email = "abhigyaawasthi2@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "hypothesis",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"